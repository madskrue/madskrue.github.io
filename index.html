            <strong>Y24<br/></strong>Første Kvartal<br/><br/>
            During the year 2024, the group released a curated series of compositions from each quarter of the year on the day that marks the end of each quarter.<br/><br/>
            <strong>Y24/Q1</strong><em> March 2024</em><br/>
            The compositions on this first part are all the result of improvisations on cello, piano, electric guitar, synth and computer, and weave together organic-sounding acoustic sound-sources with colder, digital timbres to create a tactile sound-fabric.<br/>
            <a href="https://texturcph.bandcamp.com/album/txt-11-f-rste-kvartal-y24-q1" target="_blank">Y24/Q1 on Bandcamp</a><br/><br/>
            <strong>Y24/Q2</strong> <em>June 2024</em><br/>
            The present collection features great variety in both timbre and style, spanning from bare and vulnerable piano recordings and subtle electroacoustic meditations to more abrupt and cold digital chops and passages in which intense and intricate sound-design becomes the central component of the music.<br/>
            <a href="https://texturcph.bandcamp.com/album/txt-12-f-rste-kvartal-y24-q2" target="_blank">Y24/Q2 on Bandcamp</a><br/><br/>
            <strong>Y24/Q3</strong><em> September 2024</em><br/>
            This collection is comprised of one long-form composition for piano, synths and guitar in two parts, recorded during a single session.<br/>
            <a href="https://texturcph.bandcamp.com/album/txt-13-f-rste-kvartal-y24-q3" target="_blank">Y24/Q3 on Bandcamp</a><br/><br/>
            <strong>Y24/Q4</strong><em> December 2024</em><br/>

        <item name="Skarv: Polymer Veil" image="billeder/polymer-veil.jpg" image-caption="© Mads Krue Bugge">
            <strong>Polymer Veil <br/></strong>Skarv<em><br/><br/>Polymer Veil</em> weaves parallel narratives about artificiality, with each track exploring what it means to be fake in a world increasingly shaped by differing technologies. Borrowing its title from the long-chain molecules that form DNA, cellulose, and plastics alike, the album mirrors its process of construction, each note linking fluidly to the next. Tracks like ‘Narrative Exploit’ feature video game-esque beats, while stumbling synthesizers wander through ‘Spit Gold Lip Gloss’. ‘Composite A/B’, featuring collaborators ill and Nemo, offers moments of softness, contrasting the foreboding ‘False Progress’, which cautions listeners with the refrain, “don’t trust the industry”, echoing Aïsha Devi’s ‘Uupar-Theory’. Ambient stretches are woven throughout, balancing the intensity of tracks such as the ASMR-inspired sonic nightmare ‘Nylon Fuses With Skin’.<br/><br/>
            Skarv’s collaboration with GPT-3, an outdated LLM, plays a pivotal role in shaping the album’s lyrical landscape. On the tracks ‘Skin Across Deep’, ‘Success’, and ‘Non-Stick Bead Of Insight’, Skarv integrates AI-generated text in the lyrics, giving a disorienting perspective on cognition and creativity. Reflecting on this posthuman process, Skarv notes, “The experience of generating and selecting text shifted how I view my own cognition, my creative process. I slowly began to see the world around me as data, and my nervous system a filter, a constantly updated generative model. I grew up thinking the fake, the plastic, the synthetic were inherently bad – now, I’m questioning if that’s what we all are”.<br/><br/>
            released October 25, 2024<br/>Music &amp; artwork by Mads Krue Bugge<br/>Composite A co-written &amp; co-produced by Anna Wærum Hansen<br/>Composite B co-written by Emma Ottsen Knudsen<br/>Skin Across Deep co-written by Laura Marie Madsen &amp; co-produced by Aria Leth Schütze<br/>Success co-written by Aria Leth Schütze<br/><br/>
            RHZ-025<br/>2024 Rhizome<br/><br/>
            <a href="https://skarv.bandcamp.com/album/polymer-veil" target="_blank">Polymer Veil on Bandcamp</a>
        </item>

        <item name="Første Kvartal: Ærø" image="billeder/ærø.jpg" image-caption="© Første Kvartal">
            <strong>Ærø<br/></strong>Første Kvartal<br/><br/>
            In the winter of 2021, the group went to the Danish island of Ærø where they recorded a series of improvisations, which formed the foundations for the compositions on the album. The release is an invitation into the group&#x27;s collective compositional process consisting of improvisation and digital post processing, the album encompasses both sombre drama, and meditative ambient.<br/><br/>
            The sonic expression of the album is strongly characterised by the fact that all of the material was recorded in an old half-timbered house on the Danish island Ærø - hence the title of the album. Here, the quartet recorded many hours of improvisations with both acoustic instruments such as alto, soprano and tenor saxophone, classical guitar and pump organ, as well as analog and digital synthesisers - all digitally processed in numerous ways.<br/><br/>
            Første Kvartal consists of Andreas Høegh, Adam Koch, Mads Krue Bugge og Martin Messell. The Copenhagen-based quartet have been playing together for the last 5 years in different musical projects, but are only now releasing their debut album as Første Kvartal. The four members come from different musical backgrounds, but together they have built a shared sonic and harmonic language, developed through many hours of cooperative improvisation and exploration.<br/><br/>
            released September 30, 2023<br/>Music by Første Kvartal<br/>Master by Martin Messell<br/>Released on Textur<br/><br/>
            <a href="https://texturcph.bandcamp.com/album/txt09-f-rste-kvartal-r" target="_blank">Ærø on Bandcamp</a>
        </item>

        <item name="Skarv & Alto Aria: Time Stretches (Stretched Version)" image="billeder/stretched.jpg" image-caption="© Aria Leth Schütze & Mads Krue Bugge">
            <strong>Time Stretches (Stretched Version)<br/></strong>Alto Aria/Skarv<br/><br/>
            Marking the 3 year anniversary of Rhizome&#x27;s first release, &#x27;Tides&#x27; by Alto Aria, Rhizome releases a Skarv rework of its closing track ‘Time Stretches’. Speaking to the sorrowful nature of &#x27;Tides&#x27;, the rework takes a step back in time and zooms in on a single moment, expanding on its melancholic phrasing.<br/><br/>
            The track, originally based on a 1 second violin sample stretched to the song’s 5 minute duration, has here been elongated even further, reaching a total length of 21 minutes and 16 seconds. Apart from processed stems of the original track, the rework contains vocal samples picked from &#x27;Tides&#x27; as well as fresh synth-parts, and field recordings made in Northern Jutland.<br/><br/>
            released May 7, 2023<br/>Music, mix, and artwork by Aria Leth Schütze and Mads Krue Bugge<br/>Master by Mads Krue Bugge<br/><br/>
            <a href="https://rhz000.bandcamp.com/album/time-stretches-stretched-version" target="_blank">Time Stretches (Stretched Version) on Bandcamp</a>
        </item>

        <item name="Skarv: Haptic Feedback" image="billeder/haptic-feedback.jpg" image-caption="© Mads Krue Bugge">
            <strong>Haptic Feedback</strong><br/>Skarv<br/><br/>
            “In an apartment framed by smooth concrete walls is a large single-paned glass window revealing lights in the windows of far apartment blocks. When you open the window the air feels cold and dry and you hear a faint boombox playing bass music over distant yells of protests. Through the wall to your left, you hear someone scratching it from the other side. As you place your head against the wall, the sound is transduced and you hear the scratching from within your skull.<br/><br/>
            Closing the window you see the reflection of the lights inside the apartment, two pastel magenta LED panels on the walls and a cold white fluorescent tube hanging over the desk. On the desk is a notebook and a couple of loose hard drives. Opposing the desk is the bed on which there is an open, glowing laptop and a pair of headphones. When you sit down, take the headphones on, plug them in and press play,”<br/><br/>
            ‘Haptic Feedback’ is the second record and first EP by Skarv, moniker of composer and electronic musician Mads Krue Bugge.<br/><br/>
            On ‘Haptic Feedback’ Skarv leaves the biosphere behind and embarks on a search for intimacy on a trip into the digital void of a laptop computer. Picking samples and synthesized sounds, he unfolds connections to each sound through moving but thorned compositions. The EP is a set of five tracks separated by abrupt transitions and continues the sonic investigation of his own alienation from and discontentment with the world that started with his first record, ‘A Memory Like Any Other’.<br/><br/>
            released November 18, 2021<br/>Music, text and artwork by Skarv<br/>Featuring Alto Aria on &#x27;Realistic Touch&#x27;<br/>Mastered with Aria Leth Schütze<br/><br/>
            RHZ-007<br/>2021 Rhizome<br/><br/>
            <a href="https://rhz000.bandcamp.com/album/haptic-feedback" target="_blank">Haptic Feedback on Bandcamp</a>
        </item>

        <item name="Skarv: A Memory Like Any Other" image="billeder/amlao.jpg" image-caption="© Aria Leth Schütze & Mads Krue Bugge">
            <strong>A Memory Like Any Other<br/></strong>Skarv<em><br/><br/>A Memory Like Any Other</em> is the first album by Skarv, moniker of composer and electronic musician Mads Krue Bugge.<br/><br/>
            Like the flowers growing through floors of forgotten concrete, <em>A Memory Like Any Other</em> presents a view of human life as seen from the point of alienation. The music, driven by a constant pacing between the building up and tearing down of forms, becomes a continuous construction and destruction of the relatable. Consisting of seven digital structures, the album operates through timbral exploration and dynamic variation.<br/><br/>
            Each track is a figment of the architecture of industry; stripped of all ornaments and laid bare to reveal its functions. The album appears as a memory of a never-materialising future – one devoid of, yet shaped by human intent and interference.<br/><br/>
            The music is accompanied by a 250x250x2mm steel plate with engraved graphics by Skarv.<br/><br/>
            released August 14, 2020<br/>Music and steel plate by Skarv<br/>Mastered with Aria Leth Schütze<br/>Photography by Aria Leth Schütze<br/>48°38&#x27;35.8"N 20°13&#x27;04.8"E<br/><br/>
            RHZ-002<br/>2020 Rhizome<br/><br/>
            <a href="https://rhz000.bandcamp.com/album/a-memory-like-any-other" target="_blank">A Memory Like Any Other on Bandcamp</a>
        </item>
